name: Automatic Watchlist Discovery

on:
  schedule:
    # 07:30 Thailand time (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate Python syntax
        run: |
          python -m py_compile discover.py
          python -m py_compile scanner.py
          echo "Python syntax validation passed."

      - name: Discover and update market watchlists
        run: python discover.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              "lists/thai_stocks.json",
              "lists/us_stocks.json",
              "lists/crypto.json",
              "discovery_report.json"
          ]

          for filename in files:
              path = Path(filename)
              if not path.exists():
                  raise FileNotFoundError(f"Missing output: {filename}")

              with path.open(encoding="utf-8") as f:
                  data = json.load(f)

              print(f"VALID: {filename}")

          print("All JSON files validated.")
          PY

      - name: Commit watchlists and discovery report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add \
            lists/thai_stocks.json \
            lists/us_stocks.json \
            lists/crypto.json \
            discovery_report.json

          if git diff --cached --quiet; then
            echo "No watchlist changes detected."
          else
            git commit -m "chore: refresh automatic market watchlists"
            git push
          fi
